# dsh-session-monitor bundle patch: one host row over the Web or Desktop
# profile. The row name resolves from the profile's own node_modules where
# `dsh plugin --profile <profile> add <path>` installed this package.
#
# The host half puts a Loader entry in the tree so the browser half, discovered
# through this package's `dsh.client` declaration and served from
# `exports["./client"]`, reaches the page. That carrier role is only half its
# job now: it also owns the loopback routes the detached window and the app
# window's focus request go through.
- insert:
    - id: session-monitor
      name: dsh-session-monitor
