<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
		/>
		<title>Sessions</title>
		<style>
			/*
			 * The window itself is transparent (see main.cjs), so the rounded card
			 * below is what the user actually sees. That is why the body has no
			 * background: the corners must stay see-through.
			 */
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background: transparent;
				font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
				color: var(--text);
				-webkit-user-select: none;
				user-select: none;
				cursor: default;
			}

			:root {
				--surface: #202124;
				--header: #292a2d;
				--border: #3c4043;
				--text: #e8eaed;
				--muted: #9aa0a6;
				--accent: #8ab4f8;
				--ok: #81c995;
				--warn: #fdd663;
				--run: #8ab4f8;
				--done: #81c995;
				--idle: #9aa0a6;
			}

			/*
			 * Alpha is applied by Electron's `setOpacity` on the whole window, so
			 * every colour here stays fully opaque. Fading the card's background
			 * instead would leave sharp text on a washed-out panel — the exact
			 * mismatch the WPF version was changed to fix.
			 */
			#shell {
				display: grid;
				grid-template-rows: 36px minmax(0, 1fr) 26px;
				height: 100%;
				box-sizing: border-box;
				border-radius: 10px;
				border: 1px solid var(--border);
				background: var(--surface);
				overflow: hidden;
			}

			header {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: center;
				background: var(--header);
			}

			/* The drag handle is the whole header minus the buttons. */
			#drag {
				height: 100%;
				display: flex;
				align-items: center;
				padding: 0 10px;
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				-webkit-app-region: drag;
				app-region: drag;
			}

			#controls {
				display: flex;
				gap: 4px;
				align-items: center;
				padding-right: 4px;
				/* Buttons must stay clickable inside an otherwise draggable bar. */
				-webkit-app-region: no-drag;
				app-region: no-drag;
			}

			button {
				font: inherit;
				font-size: 11px;
				height: 22px;
				padding: 0 8px;
				color: var(--muted);
				background: transparent;
				border: 1px solid var(--border);
				border-radius: 4px;
				cursor: pointer;
				white-space: nowrap;
			}

			button:hover {
				color: var(--text);
				border-color: #5f6368;
			}

			button:focus-visible {
				outline: 1px solid var(--accent);
				outline-offset: 1px;
			}

			/* An "on" toggle is filled, not just tinted: a tint alone reads as
			   "already broken" when the user expects feedback. */
			button.on {
				color: #202124;
				background: var(--accent);
				border-color: var(--accent);
			}

			#icon-buttons {
				display: flex;
				gap: 2px;
				margin-left: 2px;
			}

			#icon-buttons button {
				width: 26px;
				padding: 0;
				border-color: transparent;
				font-size: 13px;
				line-height: 1;
			}

			#list {
				overflow-y: auto;
				overflow-x: hidden;
				padding: 4px 0;
			}

			#list::-webkit-scrollbar {
				width: 8px;
			}

			#list::-webkit-scrollbar-thumb {
				background: #4a4d51;
				border-radius: 4px;
			}

			.row {
				display: grid;
				grid-template-columns: 14px 20px minmax(0, 1fr) auto;
				align-items: center;
				padding: 3px 8px;
				cursor: pointer;
				/* A hit-testable area: without one, clicks in the gaps between the
				   dot and the labels never reach the row. */
				background: transparent;
			}

			.row.child {
				padding-left: 34px;
			}

			.row:hover {
				background: rgba(138, 180, 248, 0.12);
			}

			.twisty {
				font-size: 8px;
				color: var(--muted);
				text-align: center;
				cursor: pointer;
			}

			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				justify-self: center;
				background: var(--idle);
			}

			.dot.attention {
				background: var(--warn);
			}

			.dot.running {
				background: var(--run);
				animation: pulse 1.2s ease-in-out infinite;
			}

			.dot.done {
				background: var(--done);
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 0.35;
				}
				50% {
					opacity: 1;
				}
			}

			/* The pulse is decoration; the panel must stay still for users who
			   asked the OS to reduce motion. */
			@media (prefers-reduced-motion: reduce) {
				.dot.running {
					animation: none;
					opacity: 1;
				}
			}

			.label {
				margin: 0 8px;
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.row.muted .label {
				color: var(--muted);
			}

			.state {
				font-size: 11px;
				white-space: nowrap;
			}

			.state.attention {
				color: var(--warn);
			}

			.state.running {
				color: var(--run);
			}

			.state.done {
				color: var(--done);
			}

			.state.idle {
				color: var(--muted);
			}

			#empty {
				padding: 16px 0;
				text-align: center;
				font-size: 12px;
				color: var(--muted);
			}

			footer {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: center;
				font-size: 11px;
				color: var(--muted);
				border-top: 1px solid rgba(60, 64, 67, 0.7);
			}

			#hint {
				padding: 0 10px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			#opacity-controls {
				display: flex;
				align-items: center;
				gap: 6px;
				padding-right: 10px;
			}

			#opacity {
				width: 64px;
				height: 16px;
				-webkit-appearance: none;
				appearance: none;
				background: transparent;
				cursor: pointer;
			}

			#opacity::-webkit-slider-runnable-track {
				height: 3px;
				border-radius: 2px;
				background: #5f6368;
			}

			#opacity::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 11px;
				height: 11px;
				margin-top: -4px;
				border-radius: 50%;
				background: var(--text);
			}

			#opacity-value {
				width: 34px;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}

			/*
			 * The resize grip is a real corner grip rather than the OS frame,
			 * because the frame is off. It only has to be grabbable; Windows
			 * handles the actual resize through the drag region below.
			 */
			#grip {
				position: fixed;
				right: 0;
				bottom: 0;
				width: 14px;
				height: 14px;
				cursor: nwse-resize;
				opacity: 0.45;
			}

			#grip::after {
				content: "";
				position: absolute;
				right: 2px;
				bottom: 2px;
				width: 8px;
				height: 8px;
				border-right: 1px solid var(--muted);
				border-bottom: 1px solid var(--muted);
			}

			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div id="shell">
			<header>
				<div id="drag" title=""></div>
				<div id="controls">
					<button id="filter" type="button"></button>
					<button id="notify" type="button"></button>
					<div id="icon-buttons">
						<button id="minimize" type="button" aria-label="Minimize">&#8211;</button>
						<button id="maximize" type="button" aria-label="Maximize">&#9744;</button>
						<button id="close" type="button" aria-label="Close">&#215;</button>
					</div>
				</div>
			</header>
			<div id="list" role="list"></div>
			<footer>
				<div id="hint"></div>
				<div id="opacity-controls">
					<input id="opacity" type="range" min="0.2" max="1" step="0.01" />
					<span id="opacity-value"></span>
				</div>
			</footer>
		</div>
		<div id="grip"></div>
		<script src="./shared.js"></script>
		<script src="./renderer.js"></script>
	</body>
</html>
